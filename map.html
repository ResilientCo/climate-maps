<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Mountains Climate Maps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; }
  .box { background: #fff; padding: 8px 10px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .title-box { font-weight: 600; font-size: 14px; max-width: 260px; }
  .leaflet-left .title-box { clear: none; }
  .subtitle { font-weight: 400; font-size: 12px; color: #555; margin-top: 3px; }
  .legend { font-size: 12px; line-height: 20px; }
  .legend strong { display: block; margin-bottom: 4px; }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border: 1px solid #888; }
  .popup-table { border-collapse: collapse; font-size: 13px; }
  .popup-table td { padding: 2px 6px 2px 0; vertical-align: top; }
  .popup-table td:first-child { font-weight: 600; color: #444; }
  .error { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
           background: #fff3f3; border: 1px solid #d33; color: #900; padding: 12px 16px; border-radius: 4px; max-width: 80%; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   SETTINGS: the only part you need to edit.

   The link for each map is  map.html?map=1  through  map.html?map=8

   DATA_FILE     : your GeoJSON file (all 9 layers are in this one file)
   OUTLINE_FIELD : column that only the LGA boundary has; it is drawn as
                   an outline on every map

   For each map:
     title       : text in the top corner of the map
     field       : the column this map shows (must match the data exactly)
     label       : what the value is called in the popup and legend
     unit        : added after the number, e.g. " mm" or " °C" (or "")
     breaks      : the lowest value of each colour band
     colors      : one colour per break, lightest to darkest
   ===================================================================== */
const DATA_FILE = "data/hazards.geojson";
const OUTLINE_FIELD = "LGA_NAME24";

const MAPS = {
  "1": {
    title: "Extreme fire weather days",
    subtitle: "Average annual number of extreme fire weather days (1990-2009)",
    field: "FFDI", label: "Days", unit: "",
    breaks: [0, 1, 2, 3],
    max: 4,
    colors: ["#fef0d9", "#fdcc8a", "#fc8d59", "#d7301f"]
  },
  "2": {
    title: "Change in extreme fire weather days",
    subtitle: "Projected change in average annual number of extreme fire weather days (2040-2059)",
    field: "FFDI_CHG", label: "Change in days", unit: "",
    breaks: [0, .5, 1, 1.5],
    max: 2,
    colors: ["#f2f0f7", "#cbc9e2", "#9e9ac8", "#6a51a3"]
  },
  "3": {
    title: "Average annual rainfall",
    subtitle: "Average annual rainfall (1990 - 2009)",
    field: "Ave_rain_Actual", label: "Average rainfall", unit: " mm",
    breaks: [700, 800, 900, 1000, 1100],
    max: 1200,
    colors: ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"]
  },
  "4": {
    title: "Change in rainfall (%)",
    subtitle: "Projected change in average annual rainfall (2040 - 2059)",
    field: "PC_rain_CHG", label: "Change in rainfall", unit: "%",
    breaks: [-19, -18, -17, -16, -15],
    max: -14,
    colors: ["#5c3317", "#a0522d", "#d9822b", "#e0b98a", "#f5e6d3"]
  },
  "5": {
    title: "Change in hot days",
    subtitle: "Projected change in average number of days above 35°C per year (2040-2059)",
    field: "HD_CHG", label: "Change in hot days", unit: "",
    breaks: [0, 4, 7, 10, 13],
    max: 16,
    colors: ["#feebe2", "#fbb4b9", "#f768a1", "#c51b8a", "#7a0177"]
  },
  "6": {
    title: "Hot days per year",
    subtitle: "Average number of days above 35°C per year (1990-2009)",
    field: "HD", label: "Hot days", unit: "",
    breaks: [0, 3, 6, 9, 12],
    max: 15,
    colors: ["#fee5d9", "#fcae91", "#fb6a4a", "#de2d26", "#a50f15"]
  },
  "7": {
    title: "Change in average temperature",
    subtitle: "Projected change in annual average temperature (2040-2059)",
    field: "AT_CHG_Actual", label: "Temperature change", unit: " °C",
    breaks: [1.7],
    max: 1.8,
    colors: ["#fee08b"]
  },
  "8": {
    title: "Historical average temperature",
    subtitle: "Average annual temperature (1990-2009)",
    field: "HistoricalAverageTemperature", label: "Average temperature", unit: " °C",
    breaks: [11.6, 13, 14, 15, 16, 17],
    max: 19,
    colors: ["#2166ac", "#67a9cf", "#d1e5f0", "#fddbc7", "#ef8a62", "#b2182b"]
  }
};

/* ====================== No need to edit below here ====================== */

const id = new URLSearchParams(location.search).get("map") || "1";
const cfg = MAPS[id];

const map = L.map("map", { scrollWheelZoom: false, zoomSnap: 0.25 }).setView([-33.65, 150.4], 10);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
     maxZoom: 19
   }).addTo(map);
/* Scroll-to-zoom only after the reader clicks the map, so the Wix page still scrolls normally */
map.on("click", () => map.scrollWheelZoom.enable());
map.getContainer().addEventListener("mouseleave", () => map.scrollWheelZoom.disable());

function showError(msg) {
  const d = document.createElement("div");
  d.className = "error"; d.textContent = msg;
  document.body.appendChild(d);
}
function esc(x) {
  return String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function num(v) {
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function has(v) { return v !== null && v !== undefined && v !== "" && !isNaN(Number(v)); }
function colorFor(v) {
  if (!has(v)) return "#cccccc";
  let c = cfg.colors[0];
  cfg.breaks.forEach((b, i) => { if (Number(v) >= b) c = cfg.colors[i]; });
  return c;
}

if (!cfg) {
  showError(`There is no map number "${id}". Check the ?map= part of the link.`);
} else {
  const t = L.control({ position: "topleft" });
   t.onAdd = () => {
     const d = L.DomUtil.create("div", "box title-box");
     d.textContent = cfg.title;
     if (cfg.subtitle) { const s = document.createElement("div"); s.className = "subtitle"; s.textContent = cfg.subtitle; d.appendChild(s); }
     return d;
   };
  t.addTo(map);

  const lg = L.control({ position: "bottomright" });
  lg.onAdd = () => {
    const d = L.DomUtil.create("div", "box legend");
    let h = `<strong>${esc(cfg.label)}</strong>`;
    cfg.breaks.forEach((b, i) => {
      const next = cfg.breaks[i + 1];
   h += `<i style="background:${cfg.colors[i]}"></i>${num(b)}${next !== undefined ? " to " + num(next) : (cfg.max !== undefined ? " to " + num(cfg.max) : "+")}${esc(cfg.unit)}<br>`;    });
    d.innerHTML = h;
    return d;
  };
  lg.addTo(map);

  fetch(DATA_FILE)
    .then(r => { if (!r.ok) throw new Error(`Could not find ${DATA_FILE}. Check the file name and folder.`); return r.json(); })
    .then(data => {
      const all = data.features || [];
      const mine = all.filter(f => f.properties && cfg.field in f.properties);
      if (!mine.length) throw new Error(`No data found for the column "${cfg.field}". Check the spelling.`);

      const layer = L.geoJSON({ type: "FeatureCollection", features: mine }, {
        style: f => ({ color: "#777", weight: 0.5, fillColor: colorFor(f.properties[cfg.field]), fillOpacity: 0.60 }),
        onEachFeature: (f, l) => {
          const v = f.properties[cfg.field];
          l.bindPopup(`<table class="popup-table"><tr><td>${esc(cfg.label)}</td><td>${has(v) ? num(v) + esc(cfg.unit) : "No data"}</td></tr></table>`);
          l.on("mouseover", () => { l.setStyle({ weight: 2.5, color: "#000" }); l.bringToFront(); });
          l.on("mouseout", () => { layer.resetStyle(l); if (outline) outline.bringToFront(); });
        }
      }).addTo(map);

      const lga = all.filter(f => f.properties && OUTLINE_FIELD in f.properties);
      const outline = lga.length ? L.geoJSON({ type: "FeatureCollection", features: lga }, {
        style: { color: "#222", weight: 2.5, fill: false }, interactive: false
      }).addTo(map) : null;

      map.fitBounds((outline || layer).getBounds(), { padding: [10, 10] });
      map.setZoom(map.getZoom() + 0.5, { animate: false });
    })
    .catch(e => showError(e.message));
}
</script>
</body>
</html>
